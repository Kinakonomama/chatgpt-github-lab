<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>FIP治療記録</title>

<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#202124;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--ok:#15803d;--warn:#b45309;--danger:#b91c1c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif}header{background:#fff;border-bottom:1px solid var(--line);padding:16px;position:sticky;top:0;z-index:2}header h1,main{max-width:760px;margin:auto}header h1{font-size:1.2rem}main{padding:14px;padding-bottom:32px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{border:1px solid var(--line);border-radius:12px;padding:12px}.metric strong{display:block;font-size:1.15rem;margin-top:4px}.form{display:grid;gap:10px}.form label{font-weight:600}.form input,.form select,.form textarea{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:10px;font:inherit}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{border:0;border-radius:10px;padding:11px 14px;background:var(--accent);color:#fff;font-weight:700;font-size:.95rem}button.secondary{background:#e5e7eb;color:#111827}.muted{color:var(--muted);font-size:.9rem}.ok{color:var(--ok);font-weight:700}.warn{color:var(--warn);font-weight:700}.danger{color:var(--danger);font-weight:700}.med{padding:12px 0;border-bottom:1px solid var(--line)}.med:last-child{border:0}.banner{padding:10px 12px;border-radius:10px;background:#fff7ed;margin-top:10px}.hidden{display:none!important}@media(max-width:520px){.grid,.actions,.formgrid{grid-template-columns:1fr}button{width:100%}}
</style>
</head>
<body></body>
</html>
