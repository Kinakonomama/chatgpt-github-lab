<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>FIP治療記録</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#202124;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--ok:#15803d;--warn:#b45309;--danger:#b91c1c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif}header{background:#fff;border-bottom:1px solid var(--line);padding:16px;position:sticky;top:0;z-index:2}header h1,main{max-width:760px;margin:auto}header h1{font-size:1.2rem}main{padding:14px;padding-bottom:32px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{border:1px solid var(--line);border-radius:12px;padding:12px}.metric strong{display:block;font-size:1.15rem;margin-top:4px}.form{display:grid;gap:10px}.form label{font-weight:600}.form input,.form select,.form textarea{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:10px;font:inherit}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{border:0;border-radius:10px;padding:11px 14px;background:var(--accent);color:#fff;font-weight:700;font-size:.95rem}button.secondary{background:#e5e7eb;color:#111827}.muted{color:var(--muted);font-size:.9rem}.ok{color:var(--ok);font-weight:700}.warn{color:var(--warn);font-weight:700}.danger{color:var(--danger);font-weight:700}.med{padding:12px 0;border-bottom:1px solid var(--line)}.med:last-child{border:0}.banner{padding:10px 12px;border-radius:10px;background:#fff7ed;margin-top:10px}.hidden{display:none!important}@media(max-width:520px){.grid,.actions,.formgrid{grid-template-columns:1fr}button{width:100%}}
</style>
</head>
<body>
<header><h1>🐱 FIP治療記録</h1></header>
<main>
<section id="authCard" class="card">
<h2>家族ログイン</h2>
<p class="muted">家族で同じ猫の記録を共有するためのログインです。</p>
<div class="form">
<label>メールアドレス<input id="email" type="email" autocomplete="email"></label>
<label>パスワード<input id="password" type="password" autocomplete="current-password"></label>
<div class="actions"><button onclick="signIn()">ログイン</button><button class="secondary" onclick="signUp()">新規登録</button></div>
<p id="authMessage" class="muted"></p>
</div>
</section>

<section id="app" class="hidden">
<section class="card"><div class="actions"><div><strong id="userEmail"></strong><div class="muted">家族共有モード</div></div><button class="secondary" onclick="signOut()">ログアウト</button></div></section>
<section class="card"><h2>🐱 <span id="petNameHeading">ペット</span>の治療状況</h2><div class="formgrid"><label>管理するペット<select id="petSelector" onchange="switchPet(this.value)"></select></label><div><label>&nbsp;</label><button class="secondary" onclick="addNewPet()">＋ ペットを追加</button></div></div><div class="grid"><div class="metric"><span class="muted">治療日数</span><strong id="treatmentDay">— / 82日</strong></div><div class="metric"><span class="muted">治療開始日</span><strong id="treatmentStart">未設定</strong></div></div><p id="treatmentProgress" class="muted"></p></section>
<section class="card"><h2>🐱 猫の情報</h2><div class="form"><label>名前<input id="catName" placeholder="例：きなこ"></label><div class="formgrid"><label>体重（kg）<input id="weight" type="number" step="0.01" min="0"></label><label>体温（℃）<input id="temp" type="number" step="0.1" min="0"></label></div><div class="formgrid"><label>食欲<select id="appetite"><option>◎</option><option>○</option><option>△</option><option>×</option></select></label><label>元気<select id="energy"><option>◎</option><option>○</option><option>△</option><option>×</option></select></label></div><div class="formgrid"><label>投薬期間（日）<input id="treatmentTargetDays" type="number" min="1" step="1" inputmode="numeric"></label><div></div></div><label>メモ<textarea id="memo" rows="3"></textarea></label><button onclick="savePet()">猫の情報を保存</button><p id="petMessage" class="muted"></p></div></section>

<section class="card"><h2>💊 薬を登録</h2><p class="muted">獣医師から指示された薬・剤形・量を記録します。アプリは投与量を自動決定しません。</p><div class="form"><label>薬の名前<input id="medName" placeholder="例：GS-441524、モルヌピラビル"></label><div class="formgrid"><label>剤形<select id="medForm"><option>錠剤</option><option>カプセル</option><option>粉薬</option><option>液体</option><option>その他</option></select></label><label>量<input id="medAmount" placeholder="例：1と1/4、50、0.25"></label></div><div class="formgrid"><label>単位<select id="medUnit"><option>錠</option><option>カプセル</option><option>mg</option><option>g</option><option>mL</option><option>その他</option></select></label><label>予定時刻<input id="medTime" type="time" value="20:00"></label></div><button onclick="addMedication()">薬を保存</button><p id="medMessage" class="muted"></p></div><div id="medList"></div></section>

<section class="card"><h2>📝 今日の投薬</h2><div id="doseList" class="muted">読み込み中…</div><p><a href="medication-history.html">📅 投薬履歴を開く</a></p></section>
<section class="card"><h2>🩸 体調・検査</h2><p class="muted">血液検査の数値・検診結果・写真保存は次の実装でSupabase Storageまで接続します。</p></section>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://vmqrfexbfvbzrdwlwsva.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_tiCLfDC_HgwLhJoeoSfKlw_cXr9M5FV';
const client=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
let currentUser=null,currentPet=null,currentPets=[];
const $=id=>document.getElementById(id);
function msg(id,text,cls='muted'){const e=$(id);e.textContent=text;e.className=cls}
function localDateKey(date=new Date()){const y=date.getFullYear(),m=String(date.getMonth()+1).padStart(2,'0'),d=String(date.getDate()).padStart(2,'0');return `${y}-${m}-${d}`}
function treatmentDay(startDate,targetDays=82){if(!startDate)return null;const start=new Date(`${startDate}T00:00:00`),today=new Date(`${localDateKey()}T00:00:00`);const day=Math.floor((today-start)/86400000)+1;return Math.max(1,Math.min(day,targetDays))}
function renderTreatmentProgress(){const target=Number(currentPet?.treatment_target_days)||82;const day=treatmentDay(currentPet?.treatment_start_date,target);$('treatmentDay').textContent=day?`${day} / ${target}日`:`— / ${target}日`;$('treatmentStart').textContent=currentPet?.treatment_start_date||'未設定';$('treatmentProgress').textContent=day?`治療開始日から${day}日目。残り${Math.max(target-day,0)}日です。`:'治療開始日を登録すると治療日数を表示します。'}
async function signUp(){const email=$('email').value.trim(),password=$('password').value;if(!email||password.length<6){msg('authMessage','メールアドレスと6文字以上のパスワードを入力してください。','danger');return}const {error}=await client.auth.signUp({email,password});if(error){msg('authMessage',error.message,'danger');return}msg('authMessage','確認メールを送信しました。メール内の確認を完了してからログインしてください。','ok')}
async function signIn(){const email=$('email').value.trim(),password=$('password').value;const {error}=await client.auth.signInWithPassword({email,password});if(error){msg('authMessage',error.message,'danger');return}msg('authMessage','ログインしました。','ok')}
async function signOut(){await client.auth.signOut()}
async function ensurePet(){if(currentPet)return currentPet;const {data,error}=await client.rpc('create_default_household_and_pet',{household_name:'FIP家族',pet_name:'名前未設定'});if(error){console.error(error);msg('petMessage','猫の初期設定に失敗しました。SupabaseのSQL設定を確認してください。','danger');return null}currentPet=data;return data}
async function loadPets(){const {data,error}=await client.from('pets').select('*').order('created_at',{ascending:true});if(error){console.error(error);return []}currentPets=data||[];renderPetSelector();return currentPets}
function renderPetSelector(){const el=$('petSelector');if(!el)return;el.innerHTML=currentPets.length?currentPets.map(p=>'<option value="'+escapeHtml(p.id)+'">'+escapeHtml(p.name||'名前未設定')+'</option>').join(''):'<option value="">ペット未登録</option>';if(currentPet)el.value=currentPet.id}
async function switchPet(id){const pet=currentPets.find(p=>p.id===id);if(!pet)return;currentPet=pet;await renderCurrentPet();msg('petMessage','✅ '+(currentPet.name||'ペット')+'を選択しました。','ok')}
async function renderCurrentPet(){if(!currentPet)return;$('catName').value=currentPet.name||'';$('petNameHeading').textContent=currentPet.name||'ペット';$('weight').value=currentPet.weight_kg||'';$('temp').value=currentPet.temperature_c||'';$('appetite').value=currentPet.appetite||'◎';$('energy').value=currentPet.energy||'○';$('treatmentTargetDays').value=currentPet.treatment_target_days||82;$('memo').value=currentPet.notes||'';renderTreatmentProgress();await loadMedications()}
async function addNewPet(){const name=prompt('追加するペットの名前');if(!name?.trim())return;const current=currentPet||currentPets[0];if(!current){msg('petMessage','先に初期ペットを作成してください。','danger');return}const {data:membership,error:membershipError}=await client.from('pet_memberships').select('household_id').eq('pet_id',current.id).limit(1).maybeSingle();if(membershipError||!membership?.household_id){msg('petMessage','家族情報を取得できませんでした。','danger');return}const {data,error}=await client.rpc('create_pet_for_household',{p_household_id:membership.household_id,p_name:name.trim()});if(error){msg('petMessage',error.message,'danger');return}currentPets=[...currentPets,data];currentPet=data;renderPetSelector();await renderCurrentPet();msg('petMessage','✅ '+name.trim()+'を追加しました。','ok')}
async function loadPet(){if(currentPet){renderTreatmentProgress();return}const {data,error}=await client.from('pets').select('*').order('created_at',{ascending:true}).limit(1).maybeSingle();if(error){console.error(error);return}if(!data){currentPet=await ensurePet();}else currentPet=data;if(currentPet){await loadPets();currentPet=currentPets.find(p=>p.id===currentPet.id)||currentPet;await renderCurrentPet()}}
async function savePet(){if(!currentPet)return;const targetDays=Number($('treatmentTargetDays').value);if(!Number.isInteger(targetDays)||targetDays<1){msg('petMessage','投薬期間は1日以上の整数で入力してください。','danger');return}const patch={name:$('catName').value.trim()||'名前未設定',weight_kg:$('weight').value?Number($('weight').value):null,temperature_c:$('temp').value?Number($('temp').value):null,appetite:$('appetite').value,energy:$('energy').value,treatment_target_days:targetDays,notes:$('memo').value,updated_at:new Date().toISOString()};const {data,error}=await client.from('pets').update(patch).eq('id',currentPet.id).select().single();if(error){msg('petMessage',error.message,'danger');return}currentPet=data;renderTreatmentProgress();$('petNameHeading').textContent=currentPet.name||'ペット';msg('petMessage','✅ Supabaseに保存しました。','ok')}
async function addMedication(){if(!currentPet)return;const name=$('medName').value.trim(),amount=$('medAmount').value.trim();if(!name||!amount){msg('medMessage','薬名と量を入力してください。','danger');return}const {data,error}=await client.from('medications').insert({pet_id:currentPet.id,name,form:$('medForm').value,strength_value:null,strength_unit:$('medUnit').value,notes:'表示量: '+amount}).select().single();if(error){msg('medMessage',error.message,'danger');return}const {error:scheduleError}=await client.from('medication_schedules').insert({medication_id:data.id,scheduled_time:$('medTime').value,dose_description:amount+ $('medUnit').value});if(scheduleError){msg('medMessage',scheduleError.message,'danger');return}msg('medMessage','✅ '+name+'をSupabaseに保存しました。','ok');$('medName').value='';$('medAmount').value='';await loadMedications()}
async function loadMedications(){if(!currentPet)return;const {data,error}=await client.from('medications').select('id,name,form,notes,medication_schedules(scheduled_time,dose_description)').eq('pet_id',currentPet.id).order('created_at',{ascending:true});if(error){console.error(error);return}const list=data||[];$('medList').innerHTML=list.length?list.map(m=>{const s=m.medication_schedules?.[0];return `<div class="med"><strong>${escapeHtml(s?.scheduled_time||'')}　${escapeHtml(m.name)}</strong><div class="muted">${escapeHtml(m.form||'')}・${escapeHtml(s?.dose_description||m.notes||'')}</div></div>`}).join(''):'<p class="muted">まだ薬がありません。</p>';await loadDoseList(list)}
async function loadDoseList(meds){if(!meds.length){$('doseList').textContent='薬を登録すると投薬予定が表示されます。';return}const today=localDateKey();const ids=meds.map(m=>m.id);const {data:logs,error}=await client.from('medication_logs').select('medication_id,administered_at,dose_description,status').eq('scheduled_date',today).in('medication_id',ids);if(error){console.error(error);$('doseList').textContent='投薬履歴を読み込めませんでした。';return}const byId=new Map((logs||[]).map(x=>[x.medication_id,x]));$('doseList').innerHTML=meds.map(m=>{const s=m.medication_schedules?.[0],log=byId.get(m.id);return `<div class="med"><strong>${escapeHtml(s?.scheduled_time||'')}　${escapeHtml(m.name)}</strong><div class="muted">${escapeHtml(s?.dose_description||'')}</div>${log?`<div class="ok">✅ 投薬済み ${new Date(log.administered_at).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}</div>`:`<button onclick="recordDose('${encodeURIComponent(m.id)}','${encodeURIComponent(s?.dose_description||'')}')">投薬した</button>`}</div>`}).join('')}
async function recordDose(encodedMedicationId,encodedDoseDescription){const medicationId=decodeURIComponent(encodedMedicationId),doseDescription=decodeURIComponent(encodedDoseDescription),scheduledDate=localDateKey();const existing=await client.from('medication_logs').select('id').eq('medication_id',medicationId).eq('scheduled_date',scheduledDate).limit(1);if(existing.error){alert(existing.error.message);return}if(existing.data?.length){alert('この予定にはすでに投薬記録があります。重複投薬を避けるため登録しません。');await loadMedications();return}const {data:userData}=await client.auth.getUser();const user=userData.user;if(!user)return;const who=prompt('投薬した人の名前（家族内で分かる名前）',user.email?.split('@')[0]||'');if(!who)return;const {error}=await client.from('medication_logs').insert({medication_id:medicationId,scheduled_date:scheduledDate,administered_at:new Date().toISOString(),administered_by:user.id,dose_description:doseDescription+' / '+who,status:'given'});if(error){alert(error.message);return}await loadMedications()}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]||c))}
async function boot(){const {data}=await client.auth.getSession();if(data.session){currentUser=data.session.user;$('authCard').classList.add('hidden');$('app').classList.remove('hidden');$('userEmail').textContent=currentUser.email||'';await loadPet()}client.auth.onAuthStateChange(async(event,session)=>{if(session){currentUser=session.user;$('authCard').classList.add('hidden');$('app').classList.remove('hidden');$('userEmail').textContent=currentUser.email||'';currentPet=null;await loadPet()}else{currentUser=null;currentPet=null;$('authCard').classList.remove('hidden');$('app').classList.add('hidden')}})}
boot();
</script>
</body>
</html>
